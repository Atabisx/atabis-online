<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atabis Online · Yönetim Paneli</title>
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Cinzel+Decorative:wght@700;900&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root { --bg: #0e100d; --panel: #171a15; --panel2: #1f231c; --line: #34392d; --gold: #e8b54a; --gold2: #b8862e; --text: #f4f1e8; --dim: #a7a294; --red: #e5533d; --green: #6fd36f; --blue: #6fb3ff; --purple: #b06bff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Rubik, system-ui, sans-serif; }
body { min-height: 100vh; background: radial-gradient(1200px 600px at 50% -200px, #2a2414 0%, transparent 70%), var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gold); }
.hide { display: none !important; }

/* giriş */
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
#login form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.brand { font-family: 'Cinzel Decorative', serif; font-weight: 900; color: var(--gold); letter-spacing: .04em; text-shadow: 0 2px 0 #5a3d10; }
#login .brand { font-size: 26px; text-align: center; margin: 0 0 2px; }
#login .sub { text-align: center; color: var(--dim); margin-bottom: 20px; font-size: 13px; }
label.f { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
.in { width: 100%; padding: 11px 12px; background: #0f110d; border: 1px solid var(--line); border-radius: 10px; outline: none; }
.in:focus { border-color: var(--gold2); }
.btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn.gold { background: linear-gradient(#f0c060, #c08a2a); border-color: #f5d48a; color: #2a1a05; }
.btn.red { background: #5a1d16; border-color: #8a3226; color: #ffd8d0; }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .5; }
.err { color: #ff9a8a; font-size: 13px; min-height: 18px; margin-top: 10px; }

/* üst çubuk ve sekmeler */
header { position: sticky; top: 0; z-index: 10; background: rgba(14,16,13,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.top .brand { font-size: 17px; }
.top .tag { font-size: 11px; color: var(--dim); border: 1px solid var(--line); padding: 2px 8px; border-radius: 99px; }
.top .sp { flex: 1; }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 10px 8px; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; padding: 8px 13px; border-radius: 99px; border: 1px solid transparent; background: none; color: var(--dim); cursor: pointer; font-weight: 600; }
nav button.on { color: #2a1a05; background: var(--gold); }
main { max-width: 1180px; margin: 0 auto; padding: 14px; }
h2 { font-size: 18px; margin: 4px 0 12px; }
h3 { font-size: 14px; margin: 18px 0 8px; color: var(--gold); letter-spacing: .03em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.grid { display: grid; gap: 10px; }
.stats { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.stat { padding: 10px 12px; }
.stat b { display: block; font-size: 20px; font-weight: 800; }
.stat span { color: var(--dim); font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar { height: 8px; background: #0f110d; border-radius: 6px; overflow: hidden; flex: 1; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold)); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #23271f; font-size: 13px; }
th { color: var(--dim); font-weight: 500; font-size: 12px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #1b1f18; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; }
.dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.muted { color: var(--dim); }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #262b21; color: var(--dim); }
.pill.boss { background: #4a1712; color: #ffb0a0; }
.pill.r1 { background: #1d2f4a; color: #a8d0ff; }
.pill.r2 { background: #3a2a0c; color: #ffd27a; }
.pill.m3d { background: #2d1f45; color: #d3b4ff; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.chips button { flex: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; font-size: 13px; }
.chips button.on { border-color: var(--gold); color: var(--gold); }

/* eşya ve yaratık kartları */
.items { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.it { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; min-width: 0; }
.it:hover { border-color: var(--gold2); }
.ic { flex: none; width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #0f110d; border: 2px solid #333; position: relative; }
.ic i { position: absolute; right: -4px; bottom: -4px; font-style: normal; font-size: 9px; font-weight: 800; background: var(--purple); color: #fff; border-radius: 5px; padding: 0 3px; }
.it .t { min-width: 0; }
.it .t b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .t span { font-size: 11px; color: var(--dim); }

/* pencere (eşya/yaratık ayrıntısı, 3D önizleme) */
#modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#modal .box { width: min(760px, 100%); max-height: 94vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 14px; }
@media (min-width: 700px) { #modal { align-items: center; } #modal .box { border-radius: 18px; } }
.mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.mhead h2 { margin: 0; flex: 1; }
.view { position: relative; height: 300px; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #2c2a22, #0d0f0b 75%); margin-bottom: 10px; }
.view canvas { width: 100% !important; height: 100% !important; display: block; touch-action: none; }
.view .hint { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--dim); pointer-events: none; }
.view .clips { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.kv div { background: #12150f; border-radius: 10px; padding: 8px 10px; }
.kv span { display: block; font-size: 11px; color: var(--dim); }
.kv b { font-size: 14px; }

/* oyuncu sayfası */
.inv { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.inv .it { cursor: default; }
.inv .it .x { margin-left: auto; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; background: #22281d; border: 1px solid var(--gold2); padding: 10px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 92vw; }
#toast.bad { border-color: #8a3226; background: #2a1512; }
</style>
</head>
<body>

<section id="login">
  <form id="loginForm" autocomplete="on">
    <div class="brand">Atabis Online</div>
    <div class="sub">Yönetim Paneli · GM hesabıyla giriş</div>
    <label class="f" for="lu">Kullanıcı adı</label>
    <input class="in" id="lu" autocomplete="username" required>
    <label class="f" for="lp">Şifre</label>
    <input class="in" id="lp" type="password" autocomplete="current-password" required>
    <button class="btn gold" style="width:100%;margin-top:16px" type="submit">Giriş yap</button>
    <div class="err" id="lerr"></div>
  </form>
</section>

<section id="app" class="hide">
  <header>
    <div class="top">
      <span class="brand">Atabis Online</span><span class="tag">Yönetim</span>
      <span class="sp"></span>
      <span class="muted" id="who"></span>
      <button class="btn sm" id="logout">Çıkış</button>
    </div>
    <nav id="tabs">
      <button data-t="ozet" class="on">Özet</button>
      <button data-t="oyuncular">Oyuncular</button>
      <button data-t="esyalar">Eşyalar</button>
      <button data-t="yaratiklar">Yaratıklar</button>
      <button data-t="haritalar">Haritalar</button>
      <button data-t="duyuru">Duyuru, EXP ve Etkinlik</button>
    </nav>
  </header>
  <main id="main"></main>
</section>

<div id="modal" class="hide"><div class="box" id="mbox"></div></div>
<div id="toast" class="hide"></div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
