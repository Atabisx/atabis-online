<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e100d">
<title>ATAONLINE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATAONLINE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&family=Cinzel+Decorative:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>#hud { display: none; } body.ingame #hud { display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>

<!-- ===== oyun içi arayüz ===== -->
<div id="hud">
  <div id="hud-top" class="panel">
    <div id="lv">1</div>
    <div style="display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;justify-content:space-between;font-size:12px;width:150px"><b id="myname">-</b><span id="myclass" style="color:#c9c4b6">-</span></div>
      <div class="bar hpwrap"><div id="hpbar" style="width:100%;background:#d9443a"></div><span id="hptext"></span></div>
      <div class="bar hpwrap mpwrap"><div id="mpbar" style="width:100%;background:#3d7fc4"></div><span id="mptext"></span></div>
      <div class="bar"><div id="expbar" style="width:0%;background:#e8b54a"></div></div>
    </div>
  </div>
  <div id="buffs"></div>
  <div id="place" class="panel"><b id="mapName">ATABİS KÖYÜ</b><span id="mapSub"></span></div>
  <div id="online" class="panel">Çevrimiçi: <b id="count">0</b></div>
  <button id="invbtn" aria-label="Envanter">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
  </button>
  <div id="yang" class="panel">0 Yang</div>
  <div id="log"></div>
  <div id="joy" aria-hidden="true"><div id="knob"></div></div>
  <button id="atk" aria-label="Saldır">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/></svg>
  </button>
  <button id="potBtn" aria-label="Kırmızı iksir iç">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff8a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v5L6 15a5 5 0 0 0 4.5 6h3A5 5 0 0 0 18 15l-4-7V3"/></svg>
    <i id="potCount">0</i>
  </button>
  <button id="mpBtn" aria-label="Mavi iksir iç">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7fb3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v5L6 15a5 5 0 0 0 4.5 6h3A5 5 0 0 0 18 15l-4-7V3"/></svg>
    <i id="mpCount">0</i>
  </button>
  <div id="skillbar"></div>
  <button id="skillBtn" aria-label="Beceriler">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    <i id="skillPts" style="display:none">0</i>
  </button>
  <button id="mountBtn" style="display:none" aria-label="Ata bin">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20v-6l3-4h7l3-5 2 1-1 4 2 3v7"/><path d="M8 20v-5"/><path d="M15 20v-5"/></svg>
  </button>
  <button id="fsBtn" aria-label="Tam ekran">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M16 21h5v-5"/></svg>
  </button>
  <button id="charBtn" aria-label="Karakter (özellik puanları)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
    <i id="charPts" style="display:none">0</i>
  </button>
  <button id="sndBtn" aria-label="Sesi kapat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13"/><path class="mute" d="m16 9 6 6"/><path class="mute" d="m22 9-6 6"/></svg>
  </button>
  <button id="fishBtn" style="display:none">Olta at</button>
  <button id="talkBtn" style="display:none">Konuş</button>
  <div id="labels"></div>
  <div id="toast"></div>
  <div id="inv" role="dialog" aria-label="Envanter">
    <div id="invbox">
      <div id="invhead"><b>ENVANTER</b><button id="invclose" aria-label="Kapat">×</button></div>
      <div id="invbody">
        <div id="equipcol">
          <button class="eq" data-slot="weapon"></button>
          <button class="eq" data-slot="armor"></button>
          <button class="eq" data-slot="helmet"></button>
          <button class="eq" data-slot="shoes"></button>
          <button class="eq" data-slot="bracelet"></button>
          <button class="eq" data-slot="earring"></button>
          <div id="stats"></div>
        </div>
        <div id="grid"></div>
      </div>
      <div id="detail"><span class="grow" style="color:#8b877c">Bir eşyaya dokun.</span></div>
    </div>
  </div>
  <div id="shop" class="modal" role="dialog" aria-label="Dükkân">
    <div class="modalbox">
      <div id="shopHead" class="mhead"><b id="shopTitle" style="color:#e8b54a;letter-spacing:.06em">DÜKKÂN</b><span id="shopYang" style="color:#ffe08a;font-size:13px"></span><button id="shopClose" class="xbtn" aria-label="Kapat">×</button></div>
      <div id="shopTabs" class="tabs">
        <button data-tab="potions">İksir</button><button data-tab="weapons">Silah</button><button data-tab="armor">Zırh ve takı</button><button data-tab="sell">Sat</button>
      </div>
      <div id="shopList"></div>
    </div>
  </div>
  <div id="skillwin" class="modal" role="dialog" aria-label="Beceriler">
    <div class="modalbox">
      <div class="mhead"><b style="color:#e8b54a;letter-spacing:.06em">BECERİLER</b><span id="skillPtsText" style="font-size:13px;color:#ffe08a"></span><button id="skillClose" class="xbtn" aria-label="Kapat">×</button></div>
      <div id="skillList" style="overflow-y:auto;display:flex;flex-direction:column;gap:6px"></div>
    </div>
  </div>
  <div id="charwin" class="modal" role="dialog" aria-label="Karakter">
    <div class="modalbox charbox">
      <div class="mhead"><b style="color:#e8b54a;letter-spacing:.06em">KARAKTER</b><span id="charFree" class="charfree"></span><button id="charClose" class="xbtn" aria-label="Kapat">×</button></div>
      <div id="charHead" class="charhead"></div>
      <div id="charStats" class="charstats"></div>
      <div id="charDerived" class="charderived"></div>
    </div>
  </div>
  <div id="smith" class="modal" role="dialog" aria-label="Demirci">
    <div class="modalbox">
      <div class="mhead"><b style="color:#e8b54a;letter-spacing:.06em">DEMİRCİ</b><span id="smithYang" style="color:#ffe08a;font-size:13px"></span><button id="smithClose" class="xbtn" aria-label="Kapat">×</button></div>
      <label class="smithscroll"><input type="checkbox" id="smithScroll"> Kutsama Kağıdı kullan <span id="smithScrollN"></span></label>
      <div id="smithResult"></div>
      <div id="smithList"></div>
    </div>
  </div>
  <div id="friendwin" class="modal" role="dialog" aria-label="Arkadaşlar">
    <div class="modalbox" style="width:min(420px,94vw)">
      <div class="mhead"><b style="color:#e8b54a;letter-spacing:.06em">ARKADAŞLAR</b><button id="friendClose" class="xbtn" aria-label="Kapat">×</button></div>
      <div id="friendList" style="overflow-y:auto;display:flex;flex-direction:column;gap:6px"></div>
    </div>
  </div>
  <div id="pmenu" role="menu">
    <b id="pmName"></b><small id="pmSub"></small>
    <button data-pm="whisper">Fısılda</button>
    <button data-pm="friend">Arkadaş ekle</button>
    <button data-pm="duel" class="duelbtn">Düello iste</button>
  </div>
  <div id="askBox" role="alertdialog" aria-live="assertive">
    <p id="askText"></p>
    <div class="row"><button id="askNo" class="btn alt">Reddet</button><button id="askYes" class="btn">Kabul et</button></div>
  </div>
  <div id="duelBanner" aria-live="polite"></div>
  <button id="chatBtn" aria-label="Sohbet">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>
  </button>
  <button id="friendBtn" aria-label="Arkadaşlar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a6.5 6.5 0 0 1 13 0v1"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6a5 5 0 0 1 6 4.9V20"/></svg>
    <i id="friendOn" style="display:none">0</i>
  </button>
  <div id="chatBar">
    <button id="chatTo" type="button">Herkes:</button>
    <input id="chatInput" maxlength="80" autocomplete="off" placeholder="Mesaj yaz… (/w isim mesaj: fısılda)">
    <button id="chatSend" type="button" class="btn">Gönder</button>
  </div>
  <div id="levelBanner" aria-live="polite"><div class="lb-glow"></div><div class="lb-title">SEVİYE ATLADIN</div><div class="lb-lv" id="lbLv">2</div><div class="lb-sub" id="lbSub">+3 durum puanı</div></div>
  <div id="dead" class="modal" role="dialog" aria-label="Öldün">
    <div class="modalbox" style="width:min(340px,92vw);text-align:center;align-items:center">
      <b style="font-size:24px;color:#ff6a5a;letter-spacing:.06em">ÖLDÜN</b>
      <p id="deadText" style="margin:0;color:#c9c4b6;font-size:13px"></p>
      <div class="deadbtns">
        <button id="respawnBtn" class="btn">Köyde başla</button>
        <button id="respawnHereBtn" class="btn alt" disabled>Burada başla (5)</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== giriş / kayıt ===== -->
<div id="authScreen" class="screen lobbyscr">
  <div class="logo" aria-label="Ataonline"><span class="logo-a">ATA</span><span class="logo-b">ONLINE</span><i class="logo-sub">Kadim Toprakların Efsanesi</i></div>
  <form id="authForm" class="card panel glass" autocomplete="on">
    <div class="tabs" role="tablist">
      <button type="button" id="tabLogin" class="on" role="tab">Giriş</button>
      <button type="button" id="tabRegister" role="tab">Kayıt ol</button>
    </div>
    <label for="username">Kullanıcı adı</label>
    <input id="username" name="username" autocomplete="username" maxlength="20" required>
    <label for="password">Şifre</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="100" required>
    <div id="password2wrap" style="display:none;flex-direction:column;gap:12px">
      <label for="password2">Şifre (tekrar)</label>
      <input id="password2" type="password" autocomplete="new-password" maxlength="100">
    </div>
    <button id="authBtn" class="btn" type="submit">Giriş yap</button>
    <div id="authMsg" class="msg" role="alert"></div>
    <button type="button" id="installBtn" class="btn alt installbtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 7v7"/><path d="m9 11 3 3 3-3"/></svg>
      Telefona yükle
    </button>
  </form>
</div>
<div id="installHelp" class="modal" role="dialog" aria-label="Telefona yükleme">
  <div class="modalbox" style="width:min(400px,94vw);gap:10px">
    <div class="mhead"><b style="color:#e8b54a;letter-spacing:.06em">TELEFONA YÜKLE</b><button id="installClose" class="xbtn" aria-label="Kapat">×</button></div>
    <div id="installText" style="font-size:14px;line-height:1.55;color:#c9c4b6"></div>
  </div>
</div>

<!-- ===== karakter seçimi (Metin2 tarzı: solda karakterler, ortada seçili karakter) ===== -->
<div id="charScreen" class="screen lobbyscr">
  <div class="logo small" aria-hidden="true"><span class="logo-a">ATA</span><span class="logo-b">ONLINE</span></div>
  <div class="slots panel glass">
    <div class="slotshead">KARAKTERLER</div>
    <div id="charList" class="slotlist"></div>
    <p class="sub" id="accountName"></p>
  </div>
  <div class="selinfo"><b id="selName"></b><span id="selSub"></span></div>
  <div class="selbar">
    <button id="logoutBtn" class="btn alt">Çıkış</button>
    <button id="playBtn" class="btn big" disabled>OYUNA GİR</button>
    <button id="deleteBtn" class="btn danger" disabled>Sil</button>
  </div>
  <div id="charMsg" class="msg selmsg" role="alert"></div>
</div>

<!-- ===== karakter oluşturma (seçilen sınıf ortada görünür) ===== -->
<div id="createScreen" class="screen lobbyscr">
  <div class="logo small" aria-hidden="true"><span class="logo-a">ATA</span><span class="logo-b">ONLINE</span></div>
  <form id="createForm" class="slots panel glass createbox">
    <div class="slotshead">YENİ KARAKTER</div>
    <div id="classList" class="classes"></div>
    <div id="classdesc"></div>
    <label for="charName">Karakter adı</label>
    <input id="charName" maxlength="14" autocomplete="off" placeholder="Örn. Atabis" required>
    <div class="row">
      <button type="button" id="createBack" class="btn alt">Geri</button>
      <button type="submit" class="btn">Oluştur</button>
    </div>
    <div id="createMsg" class="msg" role="alert"></div>
  </form>
  <div class="selinfo"><b id="newClassName"></b><span id="newClassSub"></span></div>
</div>

<div id="rotate">Oynamak için telefonunu yan çevir</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
